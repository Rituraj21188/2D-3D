<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mine Site GeoViewer - Rituraj Gogoi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f19;
      color: #f8fafc;
    }

    #viewport-wrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: opacity .3s ease;
    }

    .viewport.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    .viewport.inactive {
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Glass Panels */
    .glass-panel {
      background: rgba(15, 23, 42, .85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, .1);
    }

    .glass-card {
      background: rgba(15, 23, 42, .86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, .5);
    }

    /* Top Header */
    .main-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      background: linear-gradient(180deg, rgba(11, 15, 25, .96), rgba(11, 15, 25, 0));
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(6, 182, 212, .5);
    }

    .brand h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    /* Mode Switcher */
    .mode-selector-panel {
      position: absolute;
      top: 60px;
      left: 24px;
      z-index: 100;
      padding: 12px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #94a3b8;
      font-weight: 600;
    }

    .mode-cards-container {
      display: flex;
      gap: 10px;
    }

    .mode-card {
      width: 110px;
      height: 76px;
      background: rgba(30, 41, 59, .5);
      border: 1px solid rgba(255, 255, 255, .05);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: .25s;
    }

    .mode-card span {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }

    .mode-card .card-icon-glow {
      font-size: 20px;
      color: #94a3b8;
    }

    .mode-card:hover {
      background: rgba(51, 65, 85, .5);
      transform: translateY(-2px);
    }

    .mode-card.active {
      background: linear-gradient(135deg, rgba(6, 182, 212, .35), rgba(147, 51, 234, .35));
      border: 1px solid rgba(56, 189, 248, .6);
      box-shadow: 0 0 20px rgba(6, 182, 212, .3);
    }

    .mode-card.active span {
      color: white;
    }

    .mode-card.active .card-icon-glow {
      color: #38bdf8;
    }

    /* Left Sidebar */
    .left-sidebar {
      position: absolute;
      top: 175px;
      left: 24px;
      bottom: 40px;
      width: 230px;
      border-radius: 16px;
      z-index: 100;
      display: flex;
      overflow: hidden;
      transition: width .3s ease;
    }

    .sidebar-tab-strip {
      width: 44px;
      min-width: 44px;
      background: rgba(11, 15, 25, .7);
      border-right: 1px solid rgba(255, 255, 255, .08);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 12px;
    }

    .strip-btn, .strip-toggle {
      background: none;
      border: none;
      color: #64748b;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .strip-btn:hover, .strip-toggle:hover {
      background: rgba(56, 189, 248, .15);
      color: #38bdf8;
    }

    .strip-toggle {
      margin-top: auto;
    }

    .sidebar-content {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .section-heading {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: .5px;
    }

    .tool-card {
      background: rgba(30, 41, 59, .4);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .tool-card.active {
      border: 1px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, .3);
    }

    .tool-preview {
      height: 44px;
      background-size: cover;
    }

    .ortho-bg {
      background: linear-gradient(135deg, #1e3a8a, #047857);
    }

    .dsm-bg {
      background: linear-gradient(135deg, #ef4444, #eab308, #10b981);
    }

    .dtm-bg {
      background: linear-gradient(135deg, #78350f, #d97706, #fde68a);
    }

    .tool-info {
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, .85);
    }

    .tool-info span {
      font-size: 11px;
      font-weight: 500;
      color: #cbd5e1;
    }

    .active-indicator {
      color: #334155;
    }

    .tool-card.active .active-indicator {
      color: #38bdf8;
    }

    .slider-box {
      margin-top: 6px;
      background: rgba(30, 41, 59, .3);
      padding: 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
    }

    .slider-box input {
      width: 100%;
      accent-color: #38bdf8;
    }

    /* 3D Controls Panel */
    #pc-controls {
      position: absolute;
      right: 24px;
      top: 70px;
      width: 245px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, .90);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 15px 40px rgba(0, 0, 0, .5);
      z-index: 250;
      color: #e2e8f0;
      font-size: 12px;
    }

    .pc-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .pc-row {
      margin-bottom: 12px;
    }

    .pc-row-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: #94a3b8;
    }

    .pc-row input[type=range] {
      width: 100%;
      accent-color: #38bdf8;
    }

    .pc-buttons {
      display: grid;
